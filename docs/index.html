  <script>
  AFRAME.registerComponent("summon-sequence", {

      this.particles = [];

this.silhouetteReady = false;

    },


    // ==================================================
    // 胞子生成
    // ==================================================


    // ==================================================
// PNGからシルエット座標を生成
// ==================================================

createSilhouettePoints: function () {

  const targets = [
    {
      key: "cu",
      imageId: "cu-open",
      centerX: -0.40,
      centerY: 0.47,
      width: 0.90,
      height: 1.35,
      count: 130
    },

    {
      key: "co",
      imageId: "co-open",
      centerX: 0.30,
      centerY: 0.54,
      width: 0.925,
      height: 1.386,
      count: 130
    },

    {
      key: "pa",
      imageId: "pa-open",
      centerX: 0,
      centerY: 0.25,
      width: 0.925,
      height: 1.386,
      count: 160
    }
  ];

  let completed = 0;

  targets.forEach((target) => {

    const img =
      document.querySelector(`#${target.imageId}`);

    if (!img) {
      console.error(
        "シルエット用画像が見つからない:",
        target.imageId
      );
      return;
    }

    const processImage = () => {

      const canvas =
        document.createElement("canvas");

      const ctx =
        canvas.getContext("2d", {
          willReadFrequently: true
        });

      const sampleWidth = 120;

      const ratio =
        img.naturalHeight /
        img.naturalWidth;

      const sampleHeight =
        Math.round(
          sampleWidth * ratio
        );

      canvas.width =
        sampleWidth;

      canvas.height =
        sampleHeight;

      ctx.clearRect(
        0,
        0,
        sampleWidth,
        sampleHeight
      );

      ctx.drawImage(
        img,
        0,
        0,
        sampleWidth,
        sampleHeight
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          sampleWidth,
          sampleHeight
        );

      const candidates = [];

      for (
        let y = 0;
        y < sampleHeight;
        y += 2
      ) {

        for (
          let x = 0;
          x < sampleWidth;
          x += 2
        ) {

          const index =
            (y * sampleWidth + x) * 4;

          const alpha =
            imageData.data[index + 3];

          if (alpha > 80) {

            candidates.push({
              x,
              y
            });

          }
        }
      }

      // シャッフル
      for (
        let i = candidates.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          candidates[i],
          candidates[j]
        ] = [
          candidates[j],
          candidates[i]
        ];
      }

      const selected =
        candidates.slice(
          0,
          target.count
        );

      this.silhouettePoints[target.key] =
        selected.map((point) => {

          const normalizedX =
            point.x /
            sampleWidth -
            0.5;

          const normalizedY =
            0.5 -
            point.y /
            sampleHeight;

          return {
            x:
              target.centerX +
              normalizedX *
              target.width,

            y:
              target.centerY +
              normalizedY *
              target.height,

            z:
              0.07 +
              Math.random() * 0.01
          };
        });

      completed++;

      console.log(
        `${target.key} シルエット生成完了`,
        this.silhouettePoints[target.key].length
      );

      if (
  completed === targets.length
) {

  this.silhouetteReady = true;

  console.log(
    "3人分シルエット座標生成完了"
  );

  console.timeEnd("シルエット準備");


  // シルエット座標が完成してから胞子生成
  this.createParticles();
}
    };

    if (
      img.complete &&
      img.naturalWidth > 0
    ) {

      processImage();

    } else {

      img.addEventListener(
        "load",
        processImage,
        { once: true }
      );

    }
  });
},



// ==================================================
// 軽量胞子生成
// ==================================================

createParticles: function () {

  if (!this.silhouetteReady) {
    console.warn(
      "シルエット座標が未完成なので胞子生成を待機"
    );
    return;
  }

  const totalCount = 420;

  const positions =
    new Float32Array(totalCount * 3);

  const startPositions =
    new Float32Array(totalCount * 3);

  const targetPositions =
    new Float32Array(totalCount * 3);

  const phases =
    new Float32Array(totalCount);

  const allTargets = [
    ...this.silhouettePoints.cu,
    ...this.silhouettePoints.co,
    ...this.silhouettePoints.pa
  ];

  for (let i = 0; i < totalCount; i++) {

    const startX =
      (Math.random() - 0.5) * 1.8;

    const startY =
      (Math.random() - 0.5) * 1.6;

    const startZ =
      0.06 + Math.random() * 0.18;

    positions[i * 3] = startX;
    positions[i * 3 + 1] = startY;
    positions[i * 3 + 2] = startZ;

    startPositions[i * 3] = startX;
    startPositions[i * 3 + 1] = startY;
    startPositions[i * 3 + 2] = startZ;

    const target =
      allTargets[i % allTargets.length];

    targetPositions[i * 3] =
      target.x;

    targetPositions[i * 3 + 1] =
      target.y;

    targetPositions[i * 3 + 2] =
      target.z;

    phases[i] =
      Math.random() * Math.PI * 2;
  }

  const geometry =
    new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

// ==================================================
// 丸い胞子テクスチャを生成
// ==================================================

const particleCanvas =
  document.createElement("canvas");

particleCanvas.width = 64;
particleCanvas.height = 64;

const particleCtx =
  particleCanvas.getContext("2d");

// 背景を完全透明にする
particleCtx.clearRect(
  0,
  0,
  64,
  64
);

// 中心が明るく、外周がぼんやり消える胞子
const gradient =
  particleCtx.createRadialGradient(
    32, 32, 0,
    32, 32, 30
  );

gradient.addColorStop(
  0,
  "rgba(255,255,255,1)"
);

gradient.addColorStop(
  0.55,
  "rgba(255,255,255,0.95)"
);

gradient.addColorStop(
  0.80,
  "rgba(255,255,255,0.45)"
);

gradient.addColorStop(
  1,
  "rgba(255,255,255,0)"
);

particleCtx.fillStyle =
  gradient;

particleCtx.fillRect(
  0,
  0,
  64,
  64
);

const particleTexture =
  new THREE.CanvasTexture(
    particleCanvas
  );

particleTexture.needsUpdate = true;


  const material =
  new THREE.PointsMaterial({

    map: particleTexture,

    color: 0xffffff,

    size: 35,

    transparent: true,

    opacity: 1,

    alphaTest: 0,

    depthWrite: false,

    blending:
     THREE.NormalBlending,

    sizeAttenuation: true

  });

  this.particleSystem =
    new THREE.Points(
      geometry,
      material
    );

    // ==================================================

    createMycelium: function () {
      const group = new THREE.Group();

      const branchCount = 9;

      for (let branchIndex = 0; branchIndex < branchCount; branchIndex++) {
        const pointCount = 28;
        const points = [];

        const startX = (Math.random() - 0.5) * 0.8;
        const startY = -0.32 - Math.random() * 0.08;

        const endX = (Math.random() - 0.5) * 0.35;
        const endY = 0.22 + Math.random() * 0.2;

        const bend =
          (Math.random() - 0.5) * 0.28;

        for (let pointIndex = 0; pointIndex < pointCount; pointIndex++) {
          const progress =
            pointIndex / (pointCount - 1);

          const curve =
            Math.sin(progress * Math.PI) * bend;

          const x =
            startX +
            (endX - startX) * progress +
            curve;

          const y =
            startY +
            (endY - startY) * progress +
            Math.sin(
              progress * Math.PI * 2 +
              branchIndex
            ) * 0.012;

          points.push(
            new THREE.Vector3(
              x,
              y,
              0.035 + branchIndex * 0.0005
            )
          );
        }

        const geometry =
          new THREE.BufferGeometry().setFromPoints(points);

        geometry.setDrawRange(0, 0);

        const material =
          new THREE.LineBasicMaterial({
            color:
              branchIndex % 3 === 0
                ? 0xe6d8ff
                : 0xf7fff8,

            transparent: true,
            opacity: 0,

            blending: THREE.AdditiveBlending,
            depthWrite: false
          });

        const line = new THREE.Line(
          geometry,
          material
        );

        group.add(line);

        this.myceliumBranches.push({
          line,
          geometry,
          material,
          pointCount,
          delay: branchIndex * 0.045
        });
      }

      this.myceliumGroup = group;
      this.el.object3D.add(group);
    },

  if (!this.blinkDebugDone) {

    ) {

    }

    if (!blink.blinking) return;

    tick: function (time) {
      if (!this.animationStarted) return;

      const elapsed =
        (time - this.animationStartTime) / 1000;

// ----------------------------------------------
// 0〜2.95秒：
// 胞子集合 → シルエット保持 → 立ち絵と交代
// ----------------------------------------------

if (
  this.particleSystem &&
  this.silhouetteReady
) {

  if (!this.particleStartedLogged) {

    "認識から演出開始"
  );

  this.particleSystem.visible = true;

  const pos =
    this.particleData.positions;

  const start =
    this.particleData.startPositions;

  const target =
    this.particleData.targetPositions;

  const phases =
    this.particleData.phases;


  // ==============================================
  // ① 0〜1.45秒：シルエットへ集合
  // ==============================================

  const gatherDuration = 1.45;

  const gatherProgress =
    Math.min(
      elapsed / gatherDuration,
      1
    );

  const eased =
    1 -
    Math.pow(
      1 - gatherProgress,
      3
    );


  for (
    let i = 0;
    i < this.particleData.totalCount;
    i++
  ) {

    const base = i * 3;

    const phase =
      phases[i];

    // 集合途中だけ軽く漂わせる
    const swirl =
      (1 - eased) * 0.045;


    pos[base] =
      start[base] +
      (
        target[base] -
        start[base]
      ) * eased +
      Math.sin(
        elapsed * 4.2 + phase
      ) * swirl;


    pos[base + 1] =
      start[base + 1] +
      (
        target[base + 1] -
        start[base + 1]
      ) * eased +
      Math.cos(
        elapsed * 3.8 + phase
      ) * swirl;


    pos[base + 2] =
      start[base + 2] +
      (
        target[base + 2] -
        start[base + 2]
      ) * eased;
  }


  this.particleSystem.geometry
    .attributes.position
    .needsUpdate = true;


  // ==============================================
  // ② 最初だけふわっと出現
  // ==============================================

  if (elapsed < 0.18) {

    this.particleSystem.material.opacity =
      elapsed / 0.18;

  }

  // ==============================================
  // ③ 1.45〜1.80秒：
  // 完成したシルエットをそのまま見せる
  // ==============================================

  else if (elapsed < 1.80) {

    this.particleSystem.material.opacity = 1;

  }

  // ==============================================
  // ④ 1.80〜2.95秒：
  // 立ち絵登場に合わせて胞子を消す
  // ==============================================

  else if (elapsed < 2.95) {

    const fadeProgress =
      Math.min(
        (elapsed - 1.80) /
        (2.95 - 1.80),
        1
      );

    // 少し滑らかに減衰
    const smoothFade =
      fadeProgress *
      fadeProgress *
      (3 - 2 * fadeProgress);

    this.particleSystem.material.opacity =
      1 - smoothFade;

  }

  // ==============================================
  // ⑤ 完全終了
  // ==============================================

  else {

    this.particleSystem.material.opacity = 0;
    this.particleSystem.visible = false;

  }
}

      // ----------------------------------------------
// 0.32～1.75秒：菌糸成長 → フェードアウト
// ----------------------------------------------

this.myceliumBranches.forEach((branch) => {
  const localElapsed =
    elapsed - 0.32 - branch.delay;

  const growDuration = 0.8;
  const holdDuration = 0.18;
  const fadeDuration = 0.45;

  const growEnd = growDuration;
  const holdEnd = growEnd + holdDuration;
  const fadeEnd = holdEnd + fadeDuration;

  if (localElapsed <= 0) {
    branch.geometry.setDrawRange(0, 0);
    branch.material.opacity = 0;
    return;
  }

  // 伸びる
  if (localElapsed < growEnd) {
    const progress =
      Math.min(localElapsed / growDuration, 1);

    const visiblePoints =
      Math.floor(
        branch.pointCount * progress
      );

    branch.geometry.setDrawRange(
      0,
      visiblePoints
    );

    branch.material.opacity =
      Math.min(0.9, progress * 1.4);

    return;
  }

  // 伸び切った状態を少し維持
  if (localElapsed < holdEnd) {
    branch.geometry.setDrawRange(
      0,
      branch.pointCount
    );

    branch.material.opacity = 0.9;

    return;
  }

  // フェードアウト
  if (localElapsed < fadeEnd) {
    const fadeProgress =
      (localElapsed - holdEnd) / fadeDuration;

    branch.geometry.setDrawRange(
      0,
      branch.pointCount
    );

    branch.material.opacity =
      0.9 * (1 - fadeProgress);

    return;
  }

  // 完全に消す
  branch.geometry.setDrawRange(
    0,
    branch.pointCount
  );

  branch.material.opacity = 0;
